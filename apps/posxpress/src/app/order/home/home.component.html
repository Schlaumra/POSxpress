<div class="home-container">
    <div class="account-info">
        <div class="name">
            <span class="title">Benutzer:</span>
            <span>{{ user }}</span>
        </div>
    </div>
    <mat-divider></mat-divider>
    <div class="order-container">
        <h2>Offene Bestellungen:</h2>
        <div class="order-list">
            <mat-card *ngFor="let order of orderService.orders$ | async" (click)="jumpToOrder(order.table)">
                <mat-card-header>
                    <mat-card-title>Tisch: {{order.table}}</mat-card-title>
                </mat-card-header>
                <mat-card-content>
                    <span class="printed-info">Bezahlt: <mat-icon *ngIf="order.payed">check</mat-icon><mat-icon
                            *ngIf="!order.payed" color="warn">priority_high</mat-icon></span>
                    <span *ngIf="order.printed" class="printed-info">Ausgedruckt: <mat-icon>check</mat-icon></span>
                </mat-card-content>
                <mat-card-actions>
                    <div class="left">
                        <button mat-icon-button (click)="removeOrder(order.table)"
                            color="warn"><mat-icon>delete</mat-icon></button>
                    </div>
                    <div class="right">
                        <button mat-icon-button><mat-icon>play_arrow</mat-icon></button>
                    </div>
                </mat-card-actions>
            </mat-card>
        </div>
    </div>
    <div class="order-archive">
        <h2>Abgeschlossene Bestellungen:</h2>
        <ng-container *ngIf="orderArchiveSorted$ | async as orderArchive">
            <table mat-table [dataSource]="orderArchive">
                <ng-container matColumnDef="table">
                    <th mat-header-cell *matHeaderCellDef>Tisch</th>
                    <td mat-cell *matCellDef="let element"> {{element.table}} </td>
                </ng-container>

                <ng-container matColumnDef="payed_at">
                    <th mat-header-cell *matHeaderCellDef>Gezahlt</th>
                    <td mat-cell *matCellDef="let element"> {{element.timePayed | date: 'HH:mm -- dd.MM.YY' }} </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="openOrderDetails(row)"></tr>
            </table>
        </ng-container>
    </div>
</div>
